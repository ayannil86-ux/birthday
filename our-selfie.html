<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Favorite Memory ✨</title>
    <style>
        /* Reset and Elegant Warm Theme */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
        }

        body {
            background: linear-gradient(135deg, #fff3f3 0%, #fff9f0 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Decorative Floating Elements */
        .ambient-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(243,213,181,0.2) 0%, rgba(255,255,255,0) 70%);
            top: 15%;
            z-index: 1;
            pointer-events: none;
        }

        /* Container for the Photo Presentation */
        .photo-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            padding: 25px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(180, 140, 140, 0.12);
            text-align: center;
            animation: fadeInPage 1.5s ease-out;
        }

        @keyframes fadeInPage {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* The Premium Photo Frame */
        .premium-frame {
            position: relative;
            width: 100%;
            padding-top: 125px; /* Adjusts standard portrait aspect ratio */
            padding-bottom: 125px;
            background: #faf6f0;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.05), 0 8px 20px rgba(0,0,0,0.04);
            border: 8px solid #ffffff;
            margin-bottom: 25px;
        }

        /* The Actual Image Styling */
        .selfie-image {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* Special Effect: Starts slightly blurry and warms up */
            filter: blur(12px) saturate(0.8);
            transition: filter 1.2s cubic-bezier(0.25, 1, 0.5, 1), transform 1.2s ease;
        }

        /* Interaction Effect: Clears beautifully when hovering or interacting */
        .premium-frame:hover .selfie-image,
        .premium-frame:active .selfie-image {
            filter: blur(0px) saturate(1.1);
            transform: scale(1.03);
        }

        /* Aesthetic Reveal Hint Overlay */
        .reveal-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.85);
            padding: 10px 20px;
            border-radius: 30px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.85rem;
            letter-spacing: 1px;
            color: #bd8a78;
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: opacity 0.6s ease;
            z-index: 3;
        }

        .premium-frame:hover .reveal-hint {
            opacity: 0;
        }

        /* Caption Layout */
        h2 {
            color: #5c4d4d;
            font-weight: 400;
            font-size: 1.4rem;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .date-stamp {
            font-family: 'Segoe UI', sans-serif;
            font-size: 0.8rem;
            color: #bfa285;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="photo-container">
        
        <!-- The Frame with Interactive Special Effects -->
        <div class="premium-frame">
            <!-- Hint that fades out when hovered -->
            <div class="reveal-hint">✨ Tap / Hover to Reveal</div>
            
            <!-- INSERT YOUR IMAGE HERE: Change the src address to your picture link -->
            <img src="https://scontent.fccu2-4.fna.fbcdn.net/v/t1.15752-9/770561913_1421375044381781_7917866988978819076_n.jpg?_nc_cat=103&_nc_map=urlgen_bucketless&ccb=1-7&_nc_sid=9f807c&_nc_ohc=vINUZtoITXwQ7kNvwEjTMne&_nc_oc=AdquBeIIyAHTsHWfHkmfW3oZe6hsQkdHg0-4wrnE-RG03277A-Xgudhn0OjiPvYKMiUMFlGy_LLLBr58emLHpWDB&_nc_zt=23&_nc_ht=scontent.fccu2-4.fna&_nc_ss=7b6a8&oh=03_Q7cD6AH7kb-SdqZfhgvVoQNLdzV2WH_LRxdaKtemx28FiKkToQ&oe=6AA2F2EF" alt="Our Selfie" class="selfie-image">
        </div>

        <!-- Typography Context -->
        <h2>The Absolute Ultimate Memory 🤜🤛</h2>
        <div class="date-stamp">August 20th Memory</div>

    </div>

</body>
</html>
